<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlatPack3D</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6f6d68; --line: #e2e0da;
    --accent: #e8a33a; --accent-ink: #5a3a00; --accent-soft: #fdf1dc; --ok: #3f8f5a;
    --stage-bg: #eeede9; --floor: #e6e4df;
    --radius: 10px;
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171716; --panel: #212120; --ink: #ecebe7; --muted: #a09d97; --line: #34332f;
      --accent: #f0b04c; --accent-ink: #1d1400; --accent-soft: #3a2c12; --ok: #6cc08a;
      --stage-bg: #1e1e1c; --floor: #262624;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
  button { font: inherit; color: inherit; }

  header { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
  header .sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
  .seg button { border: 0; background: transparent; padding: 4px 10px; cursor: pointer; font-size: 13px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
  .seg-label { font-size: 12px; color: var(--muted); }
  #variantBox { display: none; align-items: center; gap: 6px; }
  .ghost { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
  .ghost:hover { border-color: var(--muted); }

  main { display: grid; grid-template-columns: minmax(260px, 30%) 1fr; min-height: 0; }
  main.manual-hidden { grid-template-columns: 0 1fr; }
  main.manual-hidden #manual { display: none; }

  #manual { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  #manual .bar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  #manual .tabs { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
  #manual .tabs button { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 12px; }
  #manual .tabs button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  #manual .page { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #manual img { max-width: 100%; height: auto; background: #fff; border: 1px solid var(--line); border-radius: 4px; cursor: zoom-in; }
  #manual .missing, #manual .note { color: var(--muted); font-size: 13px; line-height: 1.6; padding: 8px; }
  #manual .missing { padding: 24px 8px; }
  code { background: var(--bg); padding: 1px 5px; border-radius: 4px; }

  #stage { position: relative; min-width: 0; min-height: 0; background: var(--stage-bg); }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .card { position: absolute; background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 2px 12px rgba(0,0,0,.06); }
  #stepCard { left: 12px; top: 12px; width: min(340px, calc(100% - 24px)); padding: 12px 14px; }
  #stepCard .kicker { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  #stepCard h2 { margin: 4px 0 6px; font-size: 18px; }
  #stepCard p { margin: 0 0 8px; font-size: 14px; line-height: 1.5; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-size: 12px; border-radius: 999px; padding: 2px 8px; background: var(--bg); border: 1px solid var(--line); }
  .chip.hw { background: var(--accent-soft); border-color: transparent; color: var(--ink); }

  #hwCard { right: 12px; top: 12px; width: 250px; padding: 10px 12px; font-size: 13px; max-height: calc(100% - 90px); overflow: auto; }
  #hwCard h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 8px; }
  .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .num { font-variant-numeric: tabular-nums; }
  .row .id { grid-column: 1 / -1; font-size: 11px; color: var(--muted); }
  .meter { grid-column: 1 / -1; height: 5px; background: var(--bg); border-radius: 3px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
  .meter i.full { background: var(--ok); }
  .row.flash .num { color: var(--accent); font-weight: 700; }
  .tool { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px dashed var(--line); }
  .tool .tag { font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); visibility: hidden; white-space: nowrap; }
  .tool .tag.on { visibility: visible; }
  details { border-top: 1px dashed var(--line); padding-top: 6px; color: var(--muted); }
  details summary { cursor: pointer; font-size: 12px; }
  details ul { margin: 6px 0 0; padding-left: 16px; font-size: 12px; }

  #viewCard { right: 12px; bottom: 12px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; font-size: 13px; flex-wrap: wrap; }
  #viewCard input[type=range] { width: 120px; accent-color: var(--accent); }
  #tip { position: absolute; pointer-events: none; padding: 3px 8px; font-size: 12px; border-radius: 6px; background: var(--ink); color: var(--panel); display: none; white-space: nowrap; }
  #error { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; line-height: 1.7; color: var(--muted); background: var(--stage-bg); }

  footer { border-top: 1px solid var(--line); background: var(--panel); display: flex; align-items: center; gap: 8px; padding: 8px 12px; min-width: 0; min-height: 49px; }
  footer.static > :not(#staticNote) { display: none; }
  #staticNote { display: none; color: var(--muted); font-size: 13px; }
  footer.static #staticNote { display: block; }
  footer .nav { border: 1px solid var(--line); background: transparent; border-radius: 8px; width: 36px; height: 32px; cursor: pointer; flex: none; font-size: 15px; }
  footer .nav:hover { border-color: var(--muted); }
  #steps { display: flex; gap: 4px; overflow-x: auto; flex: 1; scrollbar-width: thin; padding: 2px; }
  #steps button { flex: none; min-width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 13px; font-variant-numeric: tabular-nums; padding: 0 8px; }
  #steps button.done { background: var(--bg); color: var(--muted); }
  #steps button.current { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: 34% 1fr; }
    main.manual-hidden { grid-template-rows: 0 1fr; }
    #manual { border-right: 0; border-bottom: 1px solid var(--line); }
    #hwCard { display: none; }
    #stepCard { width: calc(100% - 24px); }
    header .sub { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>FlatPack3D</h1>
  <div class="seg" id="pieceSeg" role="group" aria-label="件"></div>
  <div id="variantBox"><span class="seg-label">开门方向</span><div class="seg" id="variantSeg" role="group" aria-label="开门方向"></div></div>
  <span class="sub" id="subtitle">加载中…</span>
  <button class="ghost" id="toggleManual">隐藏说明书</button>
</header>
<main id="main">
  <aside id="manual">
    <div class="bar"><span id="manualLabel">说明书</span><div class="tabs" id="pageTabs"></div></div>
    <div class="page" id="pageView"></div>
  </aside>
  <section id="stage">
    <div class="card" id="stepCard"></div>
    <div class="card" id="hwCard"></div>
    <div class="card" id="viewCard">
      <label>爆炸视图 <input type="range" id="explode" min="0" max="1" step="0.01" value="0"></label>
      <button class="ghost" id="viewAll">全景</button>
      <button class="ghost" id="viewBody">看成品</button>
    </div>
    <div id="tip"></div>
    <div id="error"></div>
  </section>
</main>
<footer id="footer">
  <button class="nav" id="prev" title="上一步（←）">‹</button>
  <button class="nav" id="play" title="自动播放（空格）">▶</button>
  <button class="nav" id="next" title="下一步（→）">›</button>
  <div id="steps"></div>
  <button class="nav" id="replay" title="重放本步">↻</button>
  <span id="staticNote">全套是成品展示，没有分步；拖动"爆炸视图"可把嵌件拉出格子。</span>
</footer>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = (id) => document.getElementById(id);
const V = (a) => new THREE.Vector3(...a);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const PIECES = [
  { key: 'body', label: '置物架主体', url: 'data/kallax-body.json' },
  { key: 'door', label: '门嵌件', url: 'data/kallax-door.json' },
  { key: 'drawer', label: '抽屉嵌件', url: 'data/kallax-drawer.json' },
  { key: 'set', label: '全套', url: 'data/kallax-set.json' },
];
const jsonCache = {};
async function getJson(url) {
  if (!jsonCache[url]) {
    jsonCache[url] = fetch(url).then((r) => { if (!r.ok) throw new Error(`${url}：${r.status} ${r.statusText}`); return r.json(); });
  }
  return jsonCache[url];
}
function showError(msg) {
  const e = $('error');
  e.style.display = 'flex';
  e.innerHTML = msg;
}

// ================= 场景（各视图共用）=================
const css = getComputedStyle(document.documentElement);
const cssColor = (name) => new THREE.Color(css.getPropertyValue(name).trim());
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = cssColor('--stage-bg');
const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 6000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.495;

scene.add(new THREE.HemisphereLight(0xffffff, 0x9a958c, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(180, 420, 260);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -420, right: 420, top: 420, bottom: -420, near: 10, far: 1400 });
scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshStandardMaterial({ color: cssColor('--floor'), roughness: 1 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// ================= 材质与几何缓存 =================
const MAT = {
  white: new THREE.MeshStandardMaterial({ color: 0xf4f2ed, roughness: 0.85 }),
  frame: new THREE.MeshStandardMaterial({ color: 0xe4e0d8, roughness: 0.9 }),
  gray: new THREE.MeshStandardMaterial({ color: 0xb3b1ab, roughness: 0.9 }),
  hilite: new THREE.MeshStandardMaterial({ color: 0xf6cf86, roughness: 0.75 }),
  host: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, transparent: true, opacity: 0.28, depthWrite: false }),
  edge: new THREE.LineBasicMaterial({ color: 0x2a2a28 }),
  hostEdge: new THREE.LineBasicMaterial({ color: 0x8a877f, transparent: true, opacity: 0.6 }),
  mark: new THREE.MeshBasicMaterial({ color: 0x222222 }),
  wood: new THREE.MeshStandardMaterial({ color: 0xc9a46a, roughness: 0.8 }),
  metal: new THREE.MeshStandardMaterial({ color: 0x8d9298, roughness: 0.35, metalness: 0.8 }),
  pad: new THREE.MeshStandardMaterial({ color: 0xd8d2c4, roughness: 1 }),
};
const FACE_ORDER = ['+x', '-x', '+y', '-y', '+z', '-z'];
const geoCache = new Map();
function cached(key, make) { if (!geoCache.has(key)) geoCache.set(key, make()); return geoCache.get(key); }
const boxGeo = (s) => cached(`box:${s}`, () => new THREE.BoxGeometry(...s));
const edgeGeo = (s) => cached(`edge:${s}`, () => new THREE.EdgesGeometry(boxGeo(s)));
const cylGeo = (r1, r2, h, seg) => cached(`cyl:${r1},${r2},${h},${seg}`, () => new THREE.CylinderGeometry(r1, r2, h, seg));

function boxMesh(size, mats, edges = MAT.edge) {
  const m = new THREE.Mesh(boxGeo(size), mats);
  m.castShadow = m.receiveShadow = true;
  if (edges) { const e = new THREE.LineSegments(edgeGeo(size), edges); e.userData.isEdge = true; m.add(e); }
  return m;
}

const UP = new THREE.Vector3(0, 1, 0);
const AXIS = { x: new THREE.Vector3(1, 0, 0), y: new THREE.Vector3(0, 1, 0), z: new THREE.Vector3(0, 0, 1) };
const eulerQuat = (r) => new THREE.Quaternion().setFromEuler(new THREE.Euler(...(r || [0, 0, 0]).map(THREE.MathUtils.degToRad)));

function makeHardware(def) {
  const s = def.shape || { diameter: 1, length: 1 };
  const type = s.type || (def.kind === 'screw' ? 'screw' : 'cylinder');
  if (type === 'box') return boxMesh(s.size, MAT.metal, null);
  const r = s.diameter / 2;
  if (type === 'screw') {
    const g = new THREE.Group();
    const shaft = new THREE.Mesh(cylGeo(r, r * 0.6, s.length, 10), MAT.metal);
    const head = new THREE.Mesh(cylGeo(s.headDiameter / 2, r, Math.min(0.5, s.length / 4), 14), MAT.metal);
    head.position.y = s.length / 2 - Math.min(0.25, s.length / 8); // 钉头在 +y 端
    g.add(shaft, head);
    return g;
  }
  const mat = { dowel: MAT.wood, pad: MAT.pad }[def.kind] || MAT.metal;
  const m = new THREE.Mesh(cylGeo(r, r, s.length, def.kind === 'dowel' ? 10 : 24), mat);
  m.castShadow = true;
  return m;
}

// 让最小尺寸朝上、最大尺寸沿 x 的"平放"姿态
function flatPose(size) {
  const idx = [0, 1, 2].sort((a, b) => size[a] - size[b]);
  const cols = [];
  cols[idx[2]] = new THREE.Vector3(1, 0, 0);
  cols[idx[0]] = new THREE.Vector3(0, 1, 0);
  cols[idx[1]] = new THREE.Vector3(0, 0, 1);
  const m = new THREE.Matrix4().makeBasis(cols[0], cols[1], cols[2]);
  if (m.determinant() < 0) { cols[idx[1]].negate(); m.makeBasis(cols[0], cols[1], cols[2]); }
  return { quat: new THREE.Quaternion().setFromRotationMatrix(m), w: size[idx[2]], d: size[idx[1]], h: size[idx[0]] };
}

// ================= 动画 =================
const tweens = [];
let gen = 0;
const easeInOut = (k) => (k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2);
const easeOut = (k) => 1 - (1 - k) ** 3;
function tween(dur, fn, delay = 0) {
  return new Promise((resolve) => tweens.push({ t0: performance.now() + delay, dur, fn, resolve }));
}
function runTweens(now) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const t = tweens[i];
    const k = (now - t.t0) / t.dur;
    if (k < 0) continue;
    t.fn(Math.min(1, k));
    if (k >= 1) { tweens.splice(i, 1); t.resolve(); }
  }
}
function stopTweens() { gen++; tweens.length = 0; }

// ================= 装配视图（主体 / 嵌件）=================
class AssemblyView {
  constructor(data, variant, { interactive = true } = {}) {
    this.data = data;
    this.variant = variant;
    this.interactive = interactive;
    this.root = new THREE.Group();
    this.asm = new THREE.Group();
    this.root.add(this.asm);
    scene.add(this.root);
    this.seq = data.steps.filter((s) => !s.variant || s.variant === variant);
    this.stepsList = [data.overview, ...this.seq];
    this.explodeScale = data.explodeScale || 0.6;
    this.placeApproach = V(data.placeApproach || [0, 0, 1]);
    this.approachDist = data.approachDist || 45;
    this.hwDef = Object.fromEntries(data.hardware.map((h) => [h.id, h]));
    this.current = 0;
    this.explode = 0;
    this.buildHost();
    this.buildParts();
    this.buildHardware();
    this.buildMarks();
    this.layoutStaging();
  }

  buildHost() {
    const h = this.data.host;
    if (!h || !this.interactive) return;
    const [w, ht, d] = h.cell, t = h.wall;
    for (const [c, s] of [
      [[0, -ht / 2 - t / 2, 0], [w + 2 * t, t, d]], [[0, ht / 2 + t / 2, 0], [w + 2 * t, t, d]],
      [[-w / 2 - t / 2, 0, 0], [t, ht, d]], [[w / 2 + t / 2, 0, 0], [t, ht, d]],
    ]) {
      const m = boxMesh(s, MAT.host, MAT.hostEdge);
      m.castShadow = false;
      m.position.set(...c);
      m.userData.label = '格子（示意）';
      this.asm.add(m);
    }
  }

  buildParts() {
    const idx = (pred) => this.seq.findIndex(pred) + 1 || Infinity;
    this.parts = {};
    for (const p of this.data.parts) {
      const v = (p.variants && p.variants[this.variant]) || {};
      const group = new THREE.Group();
      const baseMat = p.type === 'frame' ? MAT.frame : MAT.white;
      const mats = (hi) => FACE_ORDER.map((f) => (p.faces && p.faces[f] === 'gray' ? MAT.gray : hi ? MAT.hilite : baseMat));
      const meshes = [];
      const pieces = [];
      if (p.pieces) {
        for (const pc of p.pieces) {
          const m = boxMesh(pc.size, mats(false));
          pieces.push({ mesh: m, folded: { pos: V(pc.offset), quat: new THREE.Quaternion() }, unfolded: { pos: V(pc.unfolded.offset), quat: eulerQuat(pc.unfolded.rotation) } });
          meshes.push(m);
          group.add(m);
        }
      } else {
        const m = boxMesh(p.size, mats(false));
        meshes.push(m);
        group.add(m);
      }
      const placedAt = idx((s) => (s.parts || []).includes(p.id));
      const placeStep = this.seq[placedAt - 1];
      group.userData = {
        kind: 'part', def: p, label: p.name, meshes, pieces, normalMats: mats(false), hiMats: mats(true),
        base: V(v.position || p.position), anchor: V(p.position), final: V(v.position || p.position), finalQuat: eulerQuat(v.rotation || p.rotation),
        bench: V((placeStep && placeStep.bench) || [0, 0, 0]),
        placedAt, installAt: idx((s) => (s.install || []).includes(p.id)), foldAt: idx((s) => (s.fold || []).includes(p.id)),
      };
      this.parts[p.id] = group;
    }
  }

  buildHardware() {
    this.hw = [];
    this.seq.forEach((s, i) => {
      for (const h of s.hardware || []) {
        const def = this.hwDef[h.id];
        for (const pl of h.placements) {
          const obj = makeHardware(def);
          const parentPart = pl.attachTo ? this.parts[pl.attachTo] : null;
          // 附着件：位置写在零件基准姿态下，换算成零件局部坐标
          const local = V(pl.position);
          if (parentPart) local.sub(parentPart.userData.anchor);
          let out;
          if (pl.dir) out = V(pl.dir).normalize();
          else { const ai = 'xyz'.indexOf(pl.axis); out = AXIS[pl.axis].clone().multiplyScalar(Math.sign(local.getComponent(ai)) || 1); }
          const isBox = def.shape && def.shape.type === 'box';
          obj.userData = {
            kind: 'hw', stepIdx: i + 1, hwId: h.id, label: `${def.name} ${pl.member || def.id}`, final: local, base: new THREE.Vector3(),
            quat: isBox ? new THREE.Quaternion() : new THREE.Quaternion().setFromUnitVectors(UP, out), out, parentPart,
          };
          this.hw.push(obj);
        }
      }
    });
  }

  buildMarks() {
    this.marks = [];
    this.seq.forEach((s, i) => {
      for (const mk of s.marks || []) {
        const m = new THREE.Mesh(boxGeo(mk.size), MAT.mark);
        m.position.set(...mk.position);
        m.userData = { stepIdx: i + 1, label: '铅笔线' };
        this.asm.add(m);
        this.marks.push(m);
      }
    });
  }

  layoutStaging() {
    const st = this.data.staging || { origin: [-150, 60], width: 300 };
    const gap = st.gap || 8;
    let x = st.origin[0], z = st.origin[1], rowD = 0;
    for (const p of this.data.parts) {
      const g = this.parts[p.id];
      let pose;
      if (p.pieces) {
        const box = new THREE.Box3();
        for (const pc of g.userData.pieces) {
          const b = new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(), V(pc.mesh.geometry.parameters ? [pc.mesh.geometry.parameters.width, pc.mesh.geometry.parameters.height, pc.mesh.geometry.parameters.depth] : [1, 1, 1]));
          b.applyMatrix4(new THREE.Matrix4().compose(pc.unfolded.pos, pc.unfolded.quat, new THREE.Vector3(1, 1, 1)));
          box.union(b);
        }
        const size = box.getSize(new THREE.Vector3());
        pose = { quat: new THREE.Quaternion(), w: size.x, d: size.z, h: size.y };
      } else pose = flatPose(p.size);
      if (x + pose.w > st.origin[0] + st.width && x > st.origin[0]) { x = st.origin[0]; z += rowD + gap; rowD = 0; }
      g.userData.stage = { pos: new THREE.Vector3(x + pose.w / 2, pose.h / 2, z + pose.d / 2), quat: pose.quat };
      x += pose.w + gap;
      rowD = Math.max(rowD, pose.d);
    }
    // 五金托盘：左侧，按种类分块
    const tray = {};
    let ty = st.origin[1];
    for (const o of this.hw) {
      const id = o.userData.hwId;
      if (!tray[id]) { tray[id] = { z: ty, n: 0 }; const total = this.hw.filter((h) => h.userData.hwId === id).length; ty += Math.ceil(total / 10) * 5 + 6; }
      const k = tray[id].n++;
      const def = this.hwDef[id];
      const lying = def.shape && def.shape.type === 'box' ? new THREE.Quaternion() : new THREE.Quaternion().setFromUnitVectors(UP, AXIS.x);
      o.userData.stage = { pos: new THREE.Vector3(st.origin[0] - 70 + (k % 10) * 5, 1, tray[id].z + Math.floor(k / 10) * 5), quat: lying };
    }
  }

  tiltAt(i) {
    let pose = this.data.defaultPose || 'flat';
    for (let k = 1; k <= i; k++) if (this.stepsList[k].pose) pose = this.stepsList[k].pose;
    return this.data.poses[pose].tilt;
  }
  applyTilt(deg) {
    this.tilt = deg;
    this.asm.rotation.set(THREE.MathUtils.degToRad(deg), 0, 0);
    this.asm.position.copy(V(this.data.poses.pivotWorld)).sub(V(this.data.poses.pivotLocal).applyEuler(this.asm.rotation));
  }

  partTarget(g, i) {
    const u = g.userData;
    return u.final.clone().add(u.installAt <= i ? new THREE.Vector3() : u.bench);
  }
  setPieces(g, folded) {
    for (const pc of g.userData.pieces) {
      const s = folded ? pc.folded : pc.unfolded;
      pc.mesh.position.copy(s.pos);
      pc.mesh.quaternion.copy(s.quat);
    }
  }
  place(obj, parent, pos, quat) {
    parent.add(obj);
    obj.userData.base.copy(pos);
    obj.position.copy(pos);
    obj.quaternion.copy(quat);
  }

  snapTo(i) {
    stopTweens();
    this.applyTilt(this.tiltAt(i));
    for (const g of Object.values(this.parts)) {
      const u = g.userData;
      if (u.placedAt <= i) this.place(g, this.asm, this.partTarget(g, i), u.finalQuat);
      else this.place(g, this.root, u.stage.pos, u.stage.quat);
      if (u.pieces.length) this.setPieces(g, u.foldAt <= i);
    }
    for (const o of this.hw) {
      const u = o.userData;
      if (u.stepIdx <= i) this.place(o, u.parentPart || this.asm, u.final, u.quat);
      else this.place(o, this.root, u.stage.pos, u.stage.quat);
    }
    for (const m of this.marks) m.visible = m.userData.stepIdx <= i;
  }

  fly(obj, parent, target, q1, approach, dist, delay, dur) {
    obj.position.copy(obj.userData.base);
    obj.updateMatrixWorld();
    parent.attach(obj);
    const from = obj.position.clone();
    const q0 = obj.quaternion.clone();
    const pre = target.clone().addScaledVector(approach, dist);
    const base = obj.userData.base.copy(from);
    return tween(dur, (k) => {
      if (k < 0.62) base.lerpVectors(from, pre, easeInOut(k / 0.62));
      else base.lerpVectors(pre, target, easeOut((k - 0.62) / 0.38));
      obj.quaternion.slerpQuaternions(q0, q1, easeInOut(Math.min(1, k / 0.62)));
    }, delay);
  }

  async animate(i) {
    const my = gen;
    const s = this.seq[i - 1];
    const placeDir = s.approach ? V(s.approach).normalize() : this.placeApproach;
    await Promise.all((s.parts || []).map((id, k) => {
      const g = this.parts[id];
      return this.fly(g, this.asm, this.partTarget(g, i), g.userData.finalQuat, placeDir, this.approachDist, k * 140, 1100);
    }));
    if (my !== gen) return;
    if ((s.fold || []).length) {
      await Promise.all(s.fold.map((id) => tween(1300, (k) => {
        const e = easeInOut(k);
        for (const pc of this.parts[id].userData.pieces) {
          pc.mesh.position.lerpVectors(pc.unfolded.pos, pc.folded.pos, e);
          pc.mesh.quaternion.slerpQuaternions(pc.unfolded.quat, pc.folded.quat, e);
        }
      })));
      if (my !== gen) return;
    }
    if ((s.install || []).length) {
      const dir = V(s.approach || [0, 0, 1]).normalize();
      await Promise.all(s.install.map((id, k) => {
        const g = this.parts[id];
        return this.fly(g, this.asm, g.userData.final, g.userData.finalQuat, dir, this.approachDist, k * 60, 1300);
      }));
      if (my !== gen) return;
    }
    const mine = this.hw.filter((o) => o.userData.stepIdx === i);
    await Promise.all(mine.map((o, k) => this.fly(o, o.userData.parentPart || this.asm, o.userData.final, o.userData.quat,
      o.userData.out, Math.min(10, this.approachDist / 2), k * (mine.length > 12 ? 28 : 80), 650)));
    if (my !== gen) return;
    for (const m of this.marks) if (m.userData.stepIdx === i) m.visible = true;
    const target = this.tiltAt(i);
    if (target !== this.tilt) {
      const from = this.tilt;
      await tween(1700, (k) => this.applyTilt(from + (target - from) * easeInOut(k)));
      if (my !== gen) return;
      frame('body');
    }
  }

  highlight(i) {
    const s = this.stepsList[i];
    const hi = new Set([...(s.parts || []), ...(s.install || []), ...(s.fold || [])]);
    for (const h of s.hardware || []) for (const pl of h.placements) if (pl.attachTo) hi.add(pl.attachTo);
    for (const [id, g] of Object.entries(this.parts)) {
      for (const m of g.userData.meshes) m.material = hi.has(id) ? g.userData.hiMats : g.userData.normalMats;
    }
  }

  go(i, animate = true) {
    i = Math.max(0, Math.min(this.seq.length, i));
    this.current = i;
    this.highlight(i);
    if (i === 0 || !animate) this.snapTo(i);
    else { this.snapTo(i - 1); this.animate(i); }
  }

  objects() { return [...Object.values(this.parts), ...this.hw]; }
  bodyObjects() { return Object.values(this.parts).filter((g) => g.parent === this.asm); }

  update() {
    for (const o of this.objects()) {
      o.position.copy(o.userData.base);
      if (o.parent === this.asm && this.explode > 0) o.position.addScaledVector(o.userData.final, this.explode * this.explodeScale);
    }
  }

  dispose() { stopTweens(); scene.remove(this.root); }
}

// ================= 全套视图（实例化）=================
class SetView {
  async init(set) {
    this.set = set;
    const body = await getJson(set.body);
    this.body = new AssemblyView(body, null, { interactive: false });
    this.body.snapTo(body.steps.length);
    this.root = this.body.root;
    this.instanced = [];
    this.lines = [];
    this.inserts = [];
    for (const ins of set.inserts) {
      const data = await getJson(ins.data);
      this.inserts.push({ ins, data });
      // 用嵌件的装配视图算出成品状态，取出每个网格的几何体与相对矩阵，再按格子实例化
      const tpl = new AssemblyView(data, ins.variant || null, { interactive: false });
      tpl.snapTo(tpl.seq.length);
      tpl.asm.position.set(0, 0, 0);
      tpl.asm.rotation.set(0, 0, 0);
      tpl.root.updateMatrixWorld(true);
      const entries = [];
      tpl.asm.traverse((o) => {
        if (o.isMesh && o.material !== MAT.mark) entries.push({ o, matrix: o.matrixWorld.clone() });
      });
      tpl.dispose();
      for (const { o, matrix } of entries) {
        const inst = new THREE.InstancedMesh(o.geometry, o.material, ins.placements.length);
        inst.castShadow = inst.receiveShadow = true;
        inst.userData = { matrix, placements: ins.placements, label: data.title };
        this.instanced.push(inst);
        this.body.asm.add(inst);
        const edge = o.children.find((c) => c.userData.isEdge);
        if (edge) {
          // 线框不能用 InstancedMesh：每格一个 LineSegments，共用同一份 EdgesGeometry
          for (const pl of ins.placements) {
            const line = new THREE.LineSegments(edge.geometry, MAT.edge);
            line.matrixAutoUpdate = false;
            line.userData = { matrix, origin: V(pl.origin) };
            this.lines.push(line);
            this.body.asm.add(line);
          }
        }
      }
    }
    this.setExplode(0);
    return this;
  }
  setExplode(e) {
    const m = new THREE.Matrix4();
    const out = new THREE.Vector3(0, 0, e * 45);
    for (const inst of this.instanced) {
      inst.userData.placements.forEach((pl, k) => {
        m.makeTranslation(V(pl.origin).add(out)).multiply(inst.userData.matrix);
        inst.setMatrixAt(k, m);
      });
      inst.instanceMatrix.needsUpdate = true;
      inst.computeBoundingSphere();
    }
    for (const line of this.lines) {
      line.matrix.makeTranslation(line.userData.origin.clone().add(out)).multiply(line.userData.matrix);
      line.matrixWorldNeedsUpdate = true;
    }
  }
  objects() { return [...this.body.objects(), ...this.instanced]; }
  bodyObjects() { return this.body.bodyObjects(); }
  update() { this.body.update(); }
  dispose() { this.body.dispose(); }
}

// ================= 相机 =================
function fitView(objs, tightness) {
  const box = new THREE.Box3();
  for (const o of objs) box.expandByObject(o);
  if (box.isEmpty()) return null;
  const c = box.getCenter(new THREE.Vector3());
  const r = box.getSize(new THREE.Vector3()).length() / 2;
  const fov = THREE.MathUtils.degToRad(camera.fov / 2);
  const d = (r / Math.sin(Math.min(fov, Math.atan(Math.tan(fov) * camera.aspect)))) * tightness;
  const dir = new THREE.Vector3(0.35, 0.62, 0.7).normalize();
  return { pos: c.clone().addScaledVector(dir, d).toArray(), target: c.toArray() };
}
function frame(name, instant = false) {
  if (!view) return;
  scene.updateMatrixWorld(true);
  const v = (name === 'body' && fitView(view.bodyObjects(), 1.25)) || fitView(view.objects(), 0.8);
  if (!v) return;
  const p0 = camera.position.clone(), t0 = controls.target.clone();
  const p1 = V(v.pos), t1 = V(v.target);
  if (instant) { camera.position.copy(p1); controls.target.copy(t1); return; }
  tween(900, (k) => {
    const e = easeInOut(k);
    camera.position.lerpVectors(p0, p1, e);
    controls.target.lerpVectors(t0, t1, e);
  });
}

let view = null;

for (const b of $('pieceSeg').children) b.onclick = () => load(b.dataset.key, null);

function syncUrl() {
  const q = new URLSearchParams();
  q.set('piece', state.piece);
  if (state.variant) q.set('variant', state.variant);
  history.replaceState(null, '', `?${q}`);
}

async function load(piece, variant, keepStep = false) {
  const info = PIECES.find((p) => p.key === piece) || PIECES[0];
  setPlaying(false);
  let data;
  try { data = await getJson(info.url); } catch (err) {
    showError(`读不到装配数据（${esc(err.message)}）。<br>请在项目根目录启动本地服务后再打开，例如：<code>python -m http.server 8137</code>`);
    throw err;
  }
  const keep = keepStep && view instanceof AssemblyView ? view.current : 0;
  if (view) view.dispose();
  view = null;
  state = { piece: info.key, variant: null };
  for (const b of $('pieceSeg').children) b.setAttribute('aria-pressed', b.dataset.key === info.key);
  $('explode').value = 0;
  if (info.key === 'set') {
    view = await new SetView().init(data);
    renderSetUi(data);
  } else {
    const variants = data.variants || null;
    const v = variants ? (variant && variants[variant] ? variant : Object.keys(variants).find((k) => variants[k].default)) : null;
    state.variant = v;
    view = new AssemblyView(data, v);
    renderAssemblyUi(data);
    go(keep, false);
  }
  syncUrl();
  scene.updateMatrixWorld(true);
  frame(info.key === 'set' ? 'body' : 'all', true);
}

function renderVariantSeg(data) {
  const box = $('variantBox');
  if (!data || !data.variants) { box.style.display = 'none'; return; }
  box.style.display = 'flex';
  $('variantSeg').innerHTML = Object.entries(data.variants).map(([k, v]) =>
    `<button data-k="${k}" title="${esc(v.note || '')}" aria-pressed="${k === state.variant}">${esc(v.label)}</button>`).join('');
  for (const b of $('variantSeg').children) b.onclick = () => { if (b.dataset.k !== state.variant) load(state.piece, b.dataset.k, true); };
}

    ${wall.length ? `<details><summary>上墙五金 ${wall.length} 种（本次不含）</summary><ul>${wall.map((h) => `<li>${esc(h.name)} ${esc(h.id)} ×${h.quantity}</li>`).join('')}</ul></details>` : ''}`;

function renderStepCard(i) {
  const data = view.data;
  const s = view.stepsList[i];
  const chips = [];
  const counts = {};
  for (const id of s.parts || []) { const t = data.parts.find((p) => p.id === id).type; counts[t] = (counts[t] || 0) + 1; }
  for (const [t, c] of Object.entries(counts)) chips.push(`<span class="chip">${esc(data.partTypes[t].name)} ×${c}</span>`);
  if ((s.install || []).length) chips.push(`<span class="chip">推入格子 ${s.install.length} 件</span>`);
  for (const h of s.hardware || []) { const d = view.hwDef[h.id]; chips.push(`<span class="chip hw">${esc(d.name)} ${esc(h.id)} ×${h.count}${d.unit ? ` ${esc(d.unit)}` : ''}</span>`); }
  for (const t of s.tools || []) chips.push(`<span class="chip">${esc(view.hwDef[t] ? `${view.hwDef[t].name} ${t}` : t)}</span>`);
  const meta = [];
  if (i > 0) meta.push(`<span>第 ${s.n} 步（${i} / ${view.seq.length}）</span>`); else meta.push('<span>准备</span>');
  meta.push(`<span>说明书 ${s.pages.map((p) => `p${p}`).join('、')}</span>`);
  if (state.variant) meta.push(`<span>${esc(data.variants[state.variant].label)}</span>`);
  if (s.repeat) meta.push(`<span>×${s.repeat} 个抽屉</span>`);
  $('stepCard').innerHTML = `
    <div class="kicker">${meta.join('')}</div>
    <h2>${esc(s.title)}</h2>
    <p>${esc(s.hint)}</p>
    <div class="chips">${chips.join('') || '<span class="chip">无新零件</span>'}</div>`;
}

function renderCounters(i) {
  const data = view.data;
  const used = {};
  view.seq.slice(0, i).forEach((s) => { for (const h of s.hardware || []) used[h.id] = (used[h.id] || 0) + h.count; });
  const cur = view.stepsList[i];
  const placed = Object.values(view.parts).filter((g) => g.userData.placedAt <= i).length;
  const set = (id, val, total) => {
    const row = $('hwCard').querySelector(`[data-id="${CSS.escape(id)}"]`);
    if (!row) return;
    row.querySelector('.num').textContent = `${val} / ${total}`;
    const bar = row.querySelector('.meter i');
    bar.style.width = `${(100 * val) / total}%`;
    bar.classList.toggle('full', val === total);
    row.classList.toggle('flash', (cur.hardware || []).some((h) => h.id === id) || (id === '__parts' && (cur.parts || []).length > 0));
  };
  set('__parts', placed, data.parts.length);
  for (const h of data.hardware) if (h.scope !== 'wall' && h.kind !== 'tool') set(h.id, used[h.id] || 0, h.quantity);
  for (const el of $('hwCard').querySelectorAll('[data-tool]')) el.querySelector('.tag').classList.toggle('on', (cur.tools || []).includes(el.dataset.tool));
}

function go(i, animate = true) {
  if (!(view instanceof AssemblyView)) return;
  i = Math.max(0, Math.min(view.seq.length, i));
  for (const b of $('steps').children) {
    const bi = Number(b.dataset.i);
    b.classList.toggle('current', bi === i);
    b.classList.toggle('done', bi < i);
    if (bi === i) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
  view.go(i, animate);
  renderStepCard(i);
  renderCounters(i);
  renderManual(view.stepsList[i]);
}

$('viewAll').onclick = () => frame('all');
$('viewBody').onclick = () => frame('body');
$('explode').oninput = (e) => {
  const v = Number(e.target.value);
  if (view instanceof SetView) view.setExplode(v); else if (view) view.explode = v;
};
$('toggleManual').onclick = () => {
  const hidden = $('main').classList.toggle('manual-hidden');
  $('toggleManual').textContent = hidden ? '显示说明书' : '隐藏说明书';
  resize();
};
let playTimer = null;
function setPlaying(on) {
  clearInterval(playTimer);
  playTimer = null;
  $('play').textContent = on ? '❚❚' : '▶';
  if (!on || !(view instanceof AssemblyView)) return;
  if (current() >= view.seq.length) go(0);
  playTimer = setInterval(() => (current() >= view.seq.length ? setPlaying(false) : go(current() + 1)), 3200);
}
$('play').onclick = () => setPlaying(!playTimer);
addEventListener('keydown', (e) => {
  if (e.target.closest('input')) return;
  if (e.key === 'ArrowRight') go(current() + 1);
  else if (e.key === 'ArrowLeft') go(current() - 1);
  else if (e.key === ' ') { e.preventDefault(); setPlaying(!playTimer); }
});

// 悬停提示
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!view) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(view.objects(), true).find((h) => h.object.isMesh);
  const tip = $('tip');
  if (!hit) { tip.style.display = 'none'; return; }
  let o = hit.object;
  while (o && !o.userData.label) o = o.parent;
  if (!o) { tip.style.display = 'none'; return; }
  tip.textContent = o.userData.label;
  tip.style.display = 'block';
  tip.style.left = `${e.clientX - r.left + 12}px`;
  tip.style.top = `${e.clientY - r.top + 12}px`;
});
renderer.domElement.addEventListener('pointerleave', () => { $('tip').style.display = 'none'; });

// 渲染循环
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();
renderer.setAnimationLoop((now) => {
  runTweens(now);
  if (view) view.update();
  controls.update();
  renderer.render(scene, camera);
});

await load(params.get('piece') || 'body', params.get('variant'));
window.__flatpack = { go, load, frame, get view() { return view; } }; // 调试用
</script>
</body>
</html>
